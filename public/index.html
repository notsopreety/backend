<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f4f4" media="(prefers-color-scheme: light)" />
  <meta name="description" content="Sawmer Backend API & Gateway" />
  <title>sawmer backend</title>

  <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin />
  <link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <style>
    :root {
      color-scheme: light dark;
      --bg-light: #f4f4f4;
      --text-light: #222222;
      --bg-dark: #1c1c1c;
      --text-dark: #f0f0f0;
      --btn-bg: #3c8527;
      --btn-hover: #316d20;
      --btn-active: #234d17;
      --btn-shadow: #2a5e1c;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      padding: max(1.5rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      font-family: "Minecraft", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-transform: uppercase;
      letter-spacing: clamp(1px, 0.4vw, 2px);
      text-align: center;
      background-color: var(--bg-light);
      color: var(--text-light);
      overflow-x: hidden;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: var(--bg-dark);
        color: var(--text-dark);
      }
    }

    .hero-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 90vw;
      margin: 0 auto;
    }

    h1 {
      font-size: clamp(2.2rem, 8.5vw, 4rem);
      line-height: 1.15;
      margin: 0;
      word-break: break-word;
      text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.4);
      animation: float 3s ease-in-out infinite;
      user-select: none;
    }

    #time {
      margin-top: clamp(10px, 2.5vh, 18px);
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      opacity: 0.9;
      letter-spacing: clamp(1px, 0.3vw, 2px);
      text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.4);
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    .contact-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: clamp(20px, 4vh, 32px);
      padding: clamp(12px, 3vw, 15px) clamp(26px, 6vw, 36px);
      font-size: clamp(0.9rem, 2.8vw, 1.05rem);
      min-height: 48px;
      min-width: 140px;
      background-color: var(--btn-bg);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      box-shadow: 0 4px 0 var(--btn-shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.2s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    @media (hover: hover) and (pointer: fine) {
      .contact-btn:hover {
        background-color: var(--btn-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 0 var(--btn-active);
      }
    }

    .contact-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--btn-active);
    }

    .contact-btn:focus-visible {
      outline: 3px solid #68b84d;
      outline-offset: 3px;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    /* Handling small mobile landscape screens */
    @media (max-height: 480px) and (orientation: landscape) {
      body {
        justify-content: center;
        padding-top: 1rem;
        padding-bottom: 1rem;
      }

      h1 {
        font-size: clamp(1.8rem, 6vw, 2.5rem);
        animation: none;
      }

      #time {
        margin-top: 6px;
        font-size: 1.1rem;
      }

      .contact-btn {
        margin-top: 14px;
        padding: 10px 24px;
        min-height: 40px;
      }
    }

    /* Respect user motion preferences */
    @media (prefers-reduced-motion: reduce) {
      h1 {
        animation: none;
      }

      .contact-btn {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="hero-container">
    <h1>Hello World</h1>
    <div id="time" aria-label="Current Time"></div>
    <button class="contact-btn" type="button" aria-label="Contact Discord"
      onclick="window.open('https://discord.com/users/931511745284038696', '_blank', 'noopener,noreferrer')">
      Contact
    </button>
  </main>

  <script>
    function updateTime() {
      const now = new Date();
      const timeString = now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
      });
      const el = document.getElementById("time");
      if (el) el.textContent = timeString;
    }

    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>

</html>
